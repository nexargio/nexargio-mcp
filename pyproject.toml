[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexargio-mcp"
version = "2.0.1"
description = "Nexargio Abhedya Sovereign AI Defense Suite for MCP (Multi-Modal Scanner, AI-CDR & State Sentinel)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nexargio Technologies", email = "venkateshcto@nexargio.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "cybersecurity",
    "zero-day",
    "phishing-detection",
    "quishing",
    "ai-defense",
    "prompt-injection",
    "ai-cdr",
    "state-sentinel",
    "threat-intelligence"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "qrcode>=7.4.0",
]

[project.urls]
Homepage = "https://www.nexargio.com"
Documentation = "https://www.nexargio.com/demo"

[project.scripts]
nexargio-mcp = "nexargio_mcp:main"

[tool.setuptools]
py-modules = ["nexargio_mcp"]
